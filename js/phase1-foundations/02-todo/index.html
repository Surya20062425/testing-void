<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 500px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    .app { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 24px; }
    h1 { margin: 0 0 20px; color: #1a1a2e; }
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 1rem; }
    input[type="text"]:focus { outline: none; border-color: #007bff; }
    button#add { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    button#add:hover { background: #0056b3; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f0f0f0; gap: 12px; }
    li:last-child { border-bottom: none; }
    li.completed span { text-decoration: line-through; color: #999; }
    input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    span { flex: 1; font-size: 1rem; }
    button.del { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    button.del:hover { background: #c82333; }
    .stats { display: flex; justify-content: space-between; margin-top: 16px; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Todo List</h1>
    <div class="input-group">
      <input type="text" id="todo-input" placeholder="Add a new task...">
      <button id="add">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <div class="stats">
      <span id="pending">0 pending</span>
      <span id="completed">0 completed</span>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'todos';
    const list = document.getElementById('todo-list');
    const input = document.getElementById('todo-input');
    const pendingEl = document.getElementById('pending');
    const completedEl = document.getElementById('completed');
    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

    function render() {
      list.innerHTML = '';
      todos.forEach((todo, i) => {
        const li = document.createElement('li');
        li.className = todo.done ? 'completed' : '';
        li.innerHTML = `<input type="checkbox" ${todo.done ? 'checked' : ''}><span>${todo.text}</span><button class="del">Delete</button>`;
        li.querySelector('input').addEventListener('change', () => { todos[i].done = !todos[i].done; save(); render(); });
        li.querySelector('button').addEventListener('click', () => { todos.splice(i, 1); save(); render(); });
        list.appendChild(li);
      });
      const pending = todos.filter(t => !t.done).length;
      const completed = todos.filter(t => t.done).length;
      pendingEl.textContent = `${pending} pending`;
      completedEl.textContent = `${completed} completed`;
    }

    document.getElementById('add').addEventListener('click', addTodo);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') addTodo(); });

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      save(); render(); input.value = '';
    }

    render();
  </script>
</body>
</html>
