<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validator</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 500px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    .app { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 32px; }
    h1 { margin: 0 0 24px; color: #1a1a2e; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
    input, select { width: 100%; padding: 12px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
    input:focus, select:focus { outline: none; border-color: #007bff; }
    input.invalid, select.invalid { border-color: #dc3545; }
    input.valid, select.valid { border-color: #28a745; }
    .error { color: #dc3545; font-size: 0.85rem; margin-top: 6px; display: none; }
    .error.show { display: block; }
    button { width: 100%; background: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .success { text-align: center; color: #28a745; margin-top: 20px; display: none; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Form Validator</h1>
    <form id="form" novalidate>
      <div class="field">
        <label>Username (3-20 chars, alphanumeric)</label>
        <input type="text" id="username" name="username" required pattern="[a-zA-Z0-9]{3,20}" autocomplete="username">
        <div class="error" id="username-error">3-20 alphanumeric characters required</div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <div class="error" id="email-error">Valid email required</div>
      </div>
      <div class="field">
        <label>Password (min 8 chars, 1 upper, 1 lower, 1 number)</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        <div class="error" id="password-error">Min 8 chars, 1 uppercase, 1 lowercase, 1 number</div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirm" name="confirm" required autocomplete="new-password">
        <div class="error" id="confirm-error">Passwords must match</div>
      </div>
      <div class="field">
        <label>Age (18-100)</label>
        <input type="number" id="age" name="age" required min="18" max="100">
        <div class="error" id="age-error">Must be between 18 and 100</div>
      </div>
      <div class="field">
        <label>Country</label>
        <select id="country" name="country" required>
          <option value="">Select...</option>
          <option>United States</option>
          <option>India</option>
          <option>United Kingdom</option>
          <option>Canada</option>
          <option>Australia</option>
          <option>Germany</option>
        </select>
        <div class="error" id="country-error">Please select a country</div>
      </div>
      <button type="submit">Submit</button>
    </form>
    <div class="success" id="success">Form submitted successfully!</div>
  </div>
  <script>
    const form = document.getElementById('form');
    const success = document.getElementById('success');
    const validators = {
      username: v => /^[a-zA-Z0-9]{3,20}$/.test(v),
      email: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
      password: v => /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(v),
      confirm: (v, f) => v === f.password.value,
      age: v => v >= 18 && v <= 100,
      country: v => v !== ''
    };
    const messages = {
      username: '3-20 alphanumeric characters required',
      email: 'Valid email required',
      password: 'Min 8 chars, 1 uppercase, 1 lowercase, 1 number',
      confirm: 'Passwords must match',
      age: 'Must be between 18 and 100',
      country: 'Please select a country'
    };

    function validateField(name, value) {
      const input = form.elements[name];
      const error = document.getElementById(`${name}-error`);
      const valid = validators[name](value, form);
      input.classList.toggle('valid', valid && value);
      input.classList.toggle('invalid', !valid && value);
      error.textContent = messages[name];
      error.classList.toggle('show', !valid && value);
      return valid;
    }

    function checkAll() {
      return Object.keys(validators).every(name => {
        const value = form.elements[name].value;
        return validators[name](value, form);
      });
    }

    Object.keys(validators).forEach(name => {
      const input = form.elements[name];
      input.addEventListener('input', () => validateField(name, input.value));
      input.addEventListener('blur', () => validateField(name, input.value));
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (checkAll()) {
        success.style.display = 'block';
        form.reset();
        form.querySelectorAll('input, select').forEach(el => el.classList.remove('valid', 'invalid'));
        setTimeout(() => success.style.display = 'none', 3000);
      }
    });
  </script>
</body>
</html>
