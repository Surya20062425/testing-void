<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini State Management</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 800px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    .app { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 32px; }
    h1 { margin: 0 0 24px; color: #1a1a2e; }
    .devtools { background: #1a1a2e; color: #00d4aa; padding: 16px; border-radius: 8px; margin-bottom: 24px; font-family: monospace; font-size: 0.85rem; max-height: 200px; overflow: auto; }
    .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    input { padding: 10px 16px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 1rem; }
    input:focus { outline: none; border-color: #007bff; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #0056b3; }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #5a6268; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #c82333; }
    .state-tree { background: #f8f9fa; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; }
    .log { background: #1a1a2e; color: #eee; padding: 16px; border-radius: 8px; margin-top: 16px; font-family: monospace; font-size: 0.85rem; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Mini State Management (Redux-like)</h1>
    <div class="devtools" id="devtools">State: {}</div>
    <div class="controls">
      <input type="text" id="todo-input" placeholder="Add todo...">
      <button id="add-todo">Add Todo</button>
      <button id="add-async" class="secondary">Add Async (delayed)</button>
      <button id="clear-completed" class="danger">Clear Completed</button>
      <button id="toggle-all" class="secondary">Toggle All</button>
    </div>
    <div class="state-tree" id="state-tree"></div>
    <div class="log" id="log"></div>
  </div>
  <script>
    // ===== Mini Redux Implementation =====
    function createStore(reducer, preloadedState = {}) {
      let state = preloadedState;
      const listeners = [];
      const middlewareChain = [];

      function getState() { return state; }

      function subscribe(listener) {
        listeners.push(listener);
        return () => { const i = listeners.indexOf(listener); if (i > -1) listeners.splice(i, 1); };
      }

      function dispatch(action) {
        state = reducer(state, action);
        listeners.forEach(l => l());
        return action;
      }

      function applyMiddleware(...middlewares) {
        middlewares.forEach(m => middlewareChain.push(m(store)));
        return store;
      }

      const store = { getState, subscribe, dispatch, applyMiddleware };
      return store;
    }

    function combineReducers(reducers) {
      return (state = {}, action) => {
        const nextState = {};
        let hasChanged = false;
        for (const key in reducers) {
          const reducer = reducers[key];
          const prev = state[key];
          const next = reducer(prev, action);
          nextState[key] = next;
          hasChanged = hasChanged || next !== prev;
        }
        return hasChanged ? nextState : state;
      };
    }

    // ===== Middleware =====
    const loggerMiddleware = store => next => action => {
      console.log('Dispatching:', action);
      const result = next(action);
      console.log('Next state:', store.getState());
      return result;
    };

    const thunkMiddleware = store => next => action => {
      if (typeof action === 'function') return action(store.dispatch, store.getState);
      return next(action);
    };

    const devtoolsMiddleware = store => next => action => {
      const result = next(action);
      if (window.__DEVTOOLS__) window.__DEVTOOLS__.send(action, store.getState());
      return result;
    };

    // ===== Reducers =====
    const todosReducer = (state = [], action) => {
      switch (action.type) {
        case 'ADD_TODO':
          return [...state, { id: Date.now(), text: action.payload, completed: false }];
        case 'TOGGLE_TODO':
          return state.map(t => t.id === action.payload ? { ...t, completed: !t.completed } : t);
        case 'DELETE_TODO':
          return state.filter(t => t.id !== action.payload);
        case 'CLEAR_COMPLETED':
          return state.filter(t => !t.completed);
        case 'TOGGLE_ALL':
          const allDone = state.every(t => t.completed);
          return state.map(t => ({ ...t, completed: !allDone }));
        default:
          return state;
      }
    };

    const filterReducer = (state = 'all', action) => {
      switch (action.type) {
        case 'SET_FILTER': return action.payload;
        default: return state;
      }
    };

    const rootReducer = combineReducers({ todos: todosReducer, filter: filterReducer });

    // ===== Store Setup =====
    const store = createStore(rootReducer, { todos: [], filter: 'all' });
    store.applyMiddleware(loggerMiddleware, thunkMiddleware, devtoolsMiddleware);

    // ===== DevTools =====
    window.__DEVTOOLS__ = {
      send: (action, state) => {
        document.getElementById('devtools').textContent = `Action: ${action.type}\nState: ${JSON.stringify(state, null, 2)}`;
        log(`[${new Date().toLocaleTimeString()}] ${action.type}`, action.payload);
      }
    };

    function log(msg, data) {
      const el = document.getElementById('log');
      el.textContent += `\n${msg}${data ? ' ' + JSON.stringify(data) : ''}`;
      el.scrollTop = el.scrollHeight;
    }

    function render() {
      const state = store.getState();
      document.getElementById('state-tree').textContent = JSON.stringify(state, null, 2);
    }

    store.subscribe(render);

    // ===== UI =====
    document.getElementById('add-todo').onclick = () => {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (text) { store.dispatch({ type: 'ADD_TODO', payload: text }); input.value = ''; }
    };

    document.getElementById('add-async').onclick = () => {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      store.dispatch((dispatch) => {
        setTimeout(() => dispatch({ type: 'ADD_TODO', payload: text + ' (async)' }), 1000);
      });
      input.value = '';
    };

    document.getElementById('clear-completed').onclick = () =>
      store.dispatch({ type: 'CLEAR_COMPLETED' });

    document.getElementById('toggle-all').onclick = () =>
      store.dispatch({ type: 'TOGGLE_ALL' });

    document.getElementById('todo-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('add-todo').click();
    });

    render();
    log('Store initialized. Try adding todos, using async actions, and watch the devtools.');
  </script>
</body>
</html>
