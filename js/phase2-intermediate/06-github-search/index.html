<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub User Search</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 800px; margin: 0 auto; padding: 20px; background: #f6f8fa; min-height: 100vh; }
    .app { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
    .header { padding: 32px; border-bottom: 1px solid #e1e4e8; }
    h1 { margin: 0 0 8px; color: #24292e; }
    .search { display: flex; gap: 12px; margin-top: 24px; }
    input { flex: 1; padding: 12px 16px; border: 1px solid #d1d5da; border-radius: 6px; font-size: 1rem; }
    input:focus { outline: none; border-color: #0366d6; box-shadow: 0 0 0 3px rgba(3,102,214,0.3); }
    button.search { background: #0366d6; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button.search:hover { background: #0256c7; }
    button.search:disabled { background: #94d3a2; cursor: not-allowed; }
    .user { display: none; padding: 32px; }
    .user.show { display: flex; gap: 32px; animation: slideUp 0.3s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .avatar { width: 120px; height: 120px; border-radius: 50%; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .name { font-size: 1.5rem; font-weight: 600; color: #24292e; margin: 0 0 8px; }
    .bio { color: #586069; margin: 0 0 16px; line-height: 1.5; }
    .stats { display: flex; gap: 24px; margin-bottom: 16px; }
    .stat { text-align: center; }
    .stat-value { font-size: 1.25rem; font-weight: 600; color: #24292e; }
    .stat-label { font-size: 0.85rem; color: #586069; text-transform: uppercase; }
    .meta { display: flex; flex-wrap: wrap; gap: 16px; color: #586069; font-size: 0.9rem; }
    .meta-item { display: flex; align-items: center; gap: 6px; }
    .repos { padding: 0 32px 32px; }
    .repos h2 { margin: 0 0 16px; color: #24292e; }
    .repo-list { display: grid; gap: 12px; }
    .repo { padding: 16px; background: #f6f8fa; border-radius: 6px; border: 1px solid #e1e4e8; transition: border-color 0.2s; }
    .repo:hover { border-color: #0366d6; }
    .repo-name { font-weight: 600; color: #0366d6; text-decoration: none; }
    .repo-name:hover { text-decoration: underline; }
    .repo-desc { color: #586069; margin: 8px 0 0; font-size: 0.9rem; }
    .repo-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 0.85rem; color: #586069; }
    .loading { padding: 32px; text-align: center; color: #586069; display: none; }
    .loading.show { display: block; }
    .spinner { border: 3px solid #e1e4e8; border-top-color: #0366d6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { padding: 32px; text-align: center; color: #cb2431; display: none; }
    .error.show { display: block; }
    .pagination { display: flex; justify-content: center; gap: 8px; padding: 24px; }
    .page-btn { padding: 8px 16px; border: 1px solid #d1d5da; background: white; border-radius: 6px; cursor: pointer; }
    .page-btn:hover:not(:disabled) { background: #f6f8fa; }
    .page-btn.active { background: #0366d6; color: white; border-color: #0366d6; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>GitHub User Search</h1>
      <div class="search">
        <input type="text" id="username" placeholder="Enter GitHub username..." autocomplete="off">
        <button class="search" id="search-btn">Search</button>
      </div>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div>Searching...</div>
    <div class="error" id="error"></div>
    <div class="user" id="user">
      <img class="avatar" id="avatar" src="" alt="">
      <div class="info">
        <h2 class="name" id="name"></h2>
        <p class="bio" id="bio"></p>
        <div class="stats">
          <div class="stat"><div class="stat-value" id="repos-count">0</div><div class="stat-label">Repos</div></div>
          <div class="stat"><div class="stat-value" id="followers-count">0</div><div class="stat-label">Followers</div></div>
          <div class="stat"><div class="stat-value" id="following-count">0</div><div class="stat-label">Following</div></div>
        </div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div class="repos" id="repos-section" style="display:none">
      <h2>Repositories</h2>
      <div class="repo-list" id="repo-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
  <script>
    const BASE = 'https://api.github.com';
    const input = document.getElementById('username');
    const searchBtn = document.getElementById('search-btn');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const userDiv = document.getElementById('user');
    const reposSection = document.getElementById('repos-section');
    const repoList = document.getElementById('repo-list');
    const pagination = document.getElementById('pagination');
    let abortController = null;
    let currentUser = '';
    let reposPage = 1;

    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    async function fetchUser(username) {
      loading.classList.add('show');
      error.classList.remove('show');
      userDiv.classList.remove('show');
      reposSection.style.display = 'none';
      searchBtn.disabled = true;
      if (abortController) abortController.abort();
      abortController = new AbortController();

      try {
        const res = await fetch(`${BASE}/users/${username}`, { signal: abortController.signal });
        if (!res.ok) throw new Error(res.status === 404 ? 'User not found' : 'Failed to fetch user');
        const data = await res.json();
        displayUser(data);
        currentUser = username;
        reposPage = 1;
        fetchRepos(username);
      } catch (e) {
        if (e.name !== 'AbortError') {
          error.textContent = e.message;
          error.classList.add('show');
        }
      } finally {
        loading.classList.remove('show');
        searchBtn.disabled = false;
      }
    }

    function displayUser(data) {
      document.getElementById('avatar').src = data.avatar_url;
      document.getElementById('name').textContent = data.name || data.login;
      document.getElementById('bio').textContent = data.bio || 'No bio available';
      document.getElementById('repos-count').textContent = data.public_repos;
      document.getElementById('followers-count').textContent = data.followers;
      document.getElementById('following-count').textContent = data.following;
      const meta = document.getElementById('meta');
      meta.innerHTML = `
        <span class="meta-item">📍 ${data.location || 'Unknown'}</span>
        <span class="meta-item">🏢 ${data.company || 'None'}</span>
        <span class="meta-item">🔗 <a href="${data.html_url}" target="_blank" rel="noopener">${data.blog || 'No website'}</a></span>
        <span class="meta-item">📅 Joined ${new Date(data.created_at).toLocaleDateString()}</span>
      `;
      userDiv.classList.add('show');
    }

    async function fetchRepos(username) {
      try {
        const res = await fetch(`${BASE}/users/${username}/repos?page=${reposPage}&per_page=10&sort=updated`);
        if (!res.ok) throw new Error('Failed to fetch repos');
        const repos = await res.json();
        displayRepos(repos);
        updatePagination(res.headers.get('Link'), repos.length);
      } catch (e) {
        console.error(e);
      }
    }

    function displayRepos(repos) {
      repoList.innerHTML = repos.map(r => `
        <div class="repo">
          <a class="repo-name" href="${r.html_url}" target="_blank" rel="noopener">${r.name}</a>
          <p class="repo-desc">${r.description || 'No description'}</p>
          <div class="repo-meta">
            <span>⭐ ${r.stargazers_count}</span>
            <span>🍴 ${r.forks_count}</span>
            <span>📝 ${r.language || 'N/A'}</span>
            <span>🕒 ${new Date(r.updated_at).toLocaleDateString()}</span>
          </div>
        </div>
      `).join('');
      reposSection.style.display = 'block';
    }

    function updatePagination(linkHeader, count) {
      const pages = parseLinkHeader(linkHeader);
      pagination.innerHTML = '';
      if (!pages.last) return;
      const total = pages.last;
      const start = Math.max(1, reposPage - 2);
      const end = Math.min(total, start + 4);
      if (start > 1) addPageBtn(1, 'First');
      if (start > 2) addPageBtn(start - 1, '...', true);
      for (let i = start; i <= end; i++) addPageBtn(i, i, false, i === reposPage);
      if (end < total - 1) addPageBtn(end + 1, '...', true);
      if (end < total) addPageBtn(total, 'Last');
    }

    function parseLinkHeader(header) {
      if (!header) return {};
      return header.split(',').reduce((acc, part) => {
        const [, url, rel] = part.match(/<([^>]+)>;\s*rel="([^"]+)"/) || [];
        if (url && rel) {
          const page = new URL(url).searchParams.get('page');
          acc[rel] = parseInt(page);
        }
        return acc;
      }, {});
    }

    function addPageBtn(page, label, disabled = false, active = false) {
      const btn = document.createElement('button');
      btn.className = `page-btn ${active ? 'active' : ''}`;
      btn.textContent = label;
      btn.disabled = disabled || active;
      if (!disabled && !active) btn.onclick = () => { reposPage = page; fetchRepos(currentUser); };
      pagination.appendChild(btn);
    }

    const debouncedSearch = debounce(fetchUser, 300);
    input.addEventListener('input', e => { if (e.target.value.trim()) debouncedSearch(e.target.value.trim()); });
    searchBtn.addEventListener('click', () => { const v = input.value.trim(); if (v) fetchUser(v); });
    input.addEventListener('keypress', e => { if (e.key === 'Enter') searchBtn.click(); });
  </script>
</body>
</html>
