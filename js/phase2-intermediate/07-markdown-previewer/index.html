<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Previewer</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f5f5f5; min-height: 100vh; }
    .container { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    .editor-pane, .preview-pane { display: flex; flex-direction: column; }
    .pane-header { background: white; padding: 16px 20px; border-bottom: 1px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; }
    .pane-header h2 { margin: 0; font-size: 1.1rem; color: #24292e; }
    .toolbar { display: flex; gap: 4px; }
    .toolbar button { background: none; border: 1px solid #d1d5da; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .toolbar button:hover { background: #f6f8fa; }
    #editor { flex: 1; border: none; outline: none; resize: none; padding: 20px; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; line-height: 1.6; background: #1e1e1e; color: #d4d4d4; }
    #preview { flex: 1; padding: 20px; overflow: auto; background: white; color: #24292e; }
    #preview h1, #preview h2, #preview h3 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
    #preview code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; }
    #preview pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
    #preview pre code { background: none; padding: 0; }
    #preview blockquote { border-left: 4px solid #dfe2e5; padding-left: 16px; color: #6a737d; margin: 0; }
    #preview table { border-collapse: collapse; width: 100%; }
    #preview th, #preview td { border: 1px solid #dfe2e5; padding: 8px 12px; }
    #preview th { background: #f6f8fa; }
    .sync { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #586069; }
    .sync input { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="editor-pane">
      <div class="pane-header">
        <h2>Editor</h2>
        <div class="toolbar">
          <button data-insert="**bold**">Bold</button>
          <button data-insert="*italic*">Italic</button>
          <button data-insert="# Heading\n">H1</button>
          <button data-insert="## Heading\n">H2</button>
          <button data-insert="- Item\n">List</button>
          <button data-insert="\`code\`">Code</button>
          <button data-insert="\n\`\`\`js\ncode\n\`\`\`\n">Block</button>
          <button data-insert="[link](url)">Link</button>
          <button data-insert="![alt](url)">Image</button>
          <button data-insert="> Quote\n">Quote</button>
        </div>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Write Markdown here..."></textarea>
    </div>
    <div class="preview-pane">
      <div class="pane-header">
        <h2>Preview</h2>
        <label class="sync"><input type="checkbox" id="sync-scroll" checked> Sync scroll</label>
      </div>
      <div id="preview"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const syncScroll = document.getElementById('sync-scroll');
    let lastScrollPos = 0;

    marked.setOptions({ breaks: true, gfm: true });

    function render() {
      const html = DOMPurify.sanitize(marked.parse(editor.value));
      preview.innerHTML = html;
    }

    editor.addEventListener('input', render);
    editor.addEventListener('scroll', () => {
      if (!syncScroll.checked) return;
      const ratio = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);
      preview.scrollTop = ratio * (preview.scrollHeight - preview.clientHeight);
    });
    preview.addEventListener('scroll', () => {
      if (!syncScroll.checked) return;
      const ratio = preview.scrollTop / (preview.scrollHeight - preview.clientHeight);
      editor.scrollTop = ratio * (editor.scrollHeight - editor.clientHeight);
    });

    document.querySelectorAll('.toolbar button').forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.dataset.insert;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
        editor.focus();
        editor.selectionStart = editor.selectionEnd = start + text.length;
        render();
      });
    });

    // Default content
    editor.value = `# Welcome to Markdown Previewer

## Features
- **Live preview** as you type
- **Syntax highlighting** for code blocks
- **Toolbar** for quick formatting
- **Sync scrolling** between panes

### Code Example
\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}
console.log(greet('World'));
\`\`\`

### Table
| Feature | Status |
|---------|--------|
| Bold | ✅ |
| Italic | ✅ |
| Code | ✅ |

> **Tip:** Try editing the text on the left!

[GitHub](https://github.com) | [MDN](https://developer.mozilla.org)
`;
    render();
  </script>
</body>
</html>
